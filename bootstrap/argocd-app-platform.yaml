apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-setup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<tu-usuario>/tfe-infra.git
    targetRevision: main
    path: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true