apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-claims
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juand-alvarado/tfe-infra.git
    targetRevision: main
    path: infra/claims
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true